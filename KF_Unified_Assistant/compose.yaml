services:
  kf-unified-assistant:
    image: ${KF_IMAGE:-ghcr.io/banard2049-cpu/kf-assistant:latest}
    build: .
    container_name: kf-unified-assistant
    pull_policy: missing
    restart: unless-stopped
    # Bind-mounted data directories may be created by root on NAS hosts.
    # Run the container as root so SQLite can always initialize the database.
    user: "0:0"
    ports:
      - "8789:8793"
    environment:
      ALLOW_REGISTRATION: "true"
      SESSION_DAYS: "30"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./assets:/app/assets:ro
      - ./modules/aibp/assets:/app/modules/aibp/assets:ro
      - ./modules/conflict/assets:/app/modules/conflict/assets:ro
      - ./modules/display/assets:/app/modules/display/assets:ro
      - ./modules/encounter/assets:/app/modules/encounter/assets:ro
      - ./modules/map/assets:/app/modules/map/assets:ro
