name: Repository assets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check tracked resources
        run: node KF_Unified_Assistant/tools/check-repository-assets.js

  check-resource-packaging:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test complete resource packs
        run: ./KF_Unified_Assistant/tools/test-resource-image-pack.ps1

      - name: Test private file exclusions
        run: ./KF_Unified_Assistant/tools/test-portable-source-filter.ps1

  check-gameplay-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Test campaign sync and gameplay
        run: node --test KF_Unified_Assistant/public/tests/*.test.cjs

      - name: Test database backups and automatic legacy migration
        run: |
          php KF_Unified_Assistant/tools/test-database-backup.php
          php KF_Unified_Assistant/tools/test-database-maintenance.php
