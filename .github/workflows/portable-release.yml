name: Portable Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Build portable package
        shell: pwsh
        run: |
          $php = Get-Command php -ErrorAction Stop
          $phpSource = Split-Path -Parent $php.Source
          $version = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME -ne 'main') { $env:GITHUB_REF_NAME -replace '^v', '' } else { "build-$env:GITHUB_RUN_NUMBER" }
          $output = Join-Path $env:GITHUB_WORKSPACE "KF-Unified-Assistant-Portable-$version-windows-x64.zip"
          & .\KF_Unified_Assistant\tools\build-portable-windows.ps1 -PhpSource $phpSource -OutputPath $output
          "PORTABLE_ZIP=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify package contents
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:PORTABLE_ZIP)) { throw 'Portable ZIP was not created.' }
          $listing = tar.exe -tf $env:PORTABLE_ZIP
          if (-not ($listing -match 'KF_Unified_Assistant_Portable/runtime/php/php.exe')) { throw 'Portable ZIP does not contain PHP runtime.' }
          if (-not ($listing -match 'KF_Unified_Assistant_Portable/public/index.html')) { throw 'Portable ZIP does not contain the web app.' }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KF-Unified-Assistant-Portable
          path: |
            ${{ env.PORTABLE_ZIP }}

  build-macos:
    strategy:
      # One leg failing must not cancel the other architecture.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      PHP_FORMULA: php@8.4
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # homebrew-core publishes prebuilt bottles for php@8.4 on both macOS 15
      # architectures. The shivammathur/php tap has no reliable bottle for the
      # x86_64 image, so setup-php fell back to compiling PHP from source and
      # failed after ~27 minutes on macos-15-intel.
      - name: Set up PHP (Homebrew bottle)
        id: php_brew
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          brew install "$PHP_FORMULA" || brew reinstall "$PHP_FORMULA"
          php_prefix="$(brew --prefix "$PHP_FORMULA")"
          echo "$php_prefix/bin" >> "$GITHUB_PATH"
          "$php_prefix/bin/php" -v

      - name: Set up PHP (setup-php fallback)
        if: steps.php_brew.outcome == 'failure'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Verify PHP runtime
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -r 'exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);' || {
            echo "PHP 8.2+ is required (found $(php -r 'echo PHP_VERSION;'))." >&2
            exit 1
          }
          for extension in pdo_sqlite sqlite3 mbstring; do
            php -r "exit(extension_loaded('$extension') ? 0 : 1);" || {
              echo "PHP extension '$extension' is missing." >&2
              exit 1
            }
          done

      - name: Build macOS package
        shell: bash
        run: |
          chmod +x ./KF_Unified_Assistant/tools/build-portable-macos.sh
          version="${GITHUB_REF_NAME:-build-${GITHUB_RUN_NUMBER}}"
          version="${version#v}"
          output="$GITHUB_WORKSPACE/KF-Unified-Assistant-Portable-${version}-macos-${{ matrix.arch }}.tar.gz"
          ./KF_Unified_Assistant/tools/build-portable-macos.sh "$output"
          echo "PORTABLE_MACOS=$output" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KF-Unified-Assistant-Portable-macOS-${{ matrix.arch }}
          path: |
            ${{ env.PORTABLE_MACOS }}

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-portable, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download portable packages
        uses: actions/download-artifact@v4
        with:
          pattern: KF-Unified-Assistant-Portable*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
