name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION -replace '^v', '' }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-.][0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Android signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KF_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KF_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KF_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KF_ANDROID_KEY_PASSWORD }}
        run: |
          $values = @($env:KEYSTORE_BASE64, $env:STORE_PASSWORD, $env:KEY_ALIAS, $env:KEY_PASSWORD)
          $keystore = Join-Path $env:RUNNER_TEMP 'kf-release.jks'
          if ($values.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -eq 0) {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          } else {
            Write-Warning 'Android signing secrets are incomplete; generating a temporary signing key. Configure fixed KF_ANDROID_* secrets before releases that must support in-place upgrades.'
            $env:STORE_PASSWORD = 'kf-ci-temporary-2026'
            $env:KEY_PASSWORD = $env:STORE_PASSWORD
            $env:KEY_ALIAS = 'kf-ci-temporary'
            & keytool -genkeypair -noprompt -keystore $keystore -storepass $env:STORE_PASSWORD -keypass $env:KEY_PASSWORD -alias $env:KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=KF Assistant CI, O=KF Community, C=CN'
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate temporary Android signing key.' }
          }
          "KF_KEYSTORE=$keystore" >> $env:GITHUB_ENV
          "KF_STORE_PASSWORD=$env:STORE_PASSWORD" >> $env:GITHUB_ENV
          "KF_KEY_ALIAS=$env:KEY_ALIAS" >> $env:GITHUB_ENV
          "KF_KEY_PASSWORD=$env:KEY_PASSWORD" >> $env:GITHUB_ENV

      - name: Build signed APK
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $output = Join-Path $env:GITHUB_WORKSPACE "KF-Unified-Assistant-Android-$version.apk"
          & .\KF_Unified_Assistant\tools\packaging\android\tools\build-release-apk.ps1 -Version $version -OutputPath $output -KeystorePath $env:KF_KEYSTORE -StorePassword $env:KF_STORE_PASSWORD -KeyAlias $env:KF_KEY_ALIAS -KeyPassword $env:KF_KEY_PASSWORD
          "APK_PATH=$output" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KF-Unified-Assistant-Android-${{ steps.release.outputs.version }}
          path: |
            ${{ env.APK_PATH }}

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: false
          files: |
            ${{ env.APK_PATH }}
